name: Build and Push Frontend Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mi-app-repo

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'proyecto-is2/package-lock.json'

    - name: Install dependencies
      working-directory: proyecto-is2
      run: |
        npm cache clean --force
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-audit

    - name: Run unit tests
      working-directory: proyecto-is2
      run: |
        npm run test:run

    - name: Run build test
      working-directory: proyecto-is2
      run: |
        npm run build

    - name: Run installation tests
      working-directory: proyecto-is2
      run: |
        node -e "console.log('Node.js version:', process.version)"
        npm --version
        node -e "console.log('React project built successfully')"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
      run: |
        docker build --build-arg VITE_API_URL=$VITE_API_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG .
        docker build --build-arg VITE_API_URL=$VITE_API_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
        echo "image_tag=frontend-$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "::notice::Image pushed to $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Get ECR Login Password
      id: ecr-login
      run: |
        echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        ECR_PASSWORD: ${{ steps.ecr-login.outputs.password }}
      with:
        host: ${{ secrets.EC2_FRONTEND_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        envs: ECR_REGISTRY,ECR_PASSWORD,ECR_REPOSITORY,AWS_REGION
        script: |
          # Login to ECR
          echo $ECR_PASSWORD | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Stop and remove existing container
          docker stop frontend-container 2>/dev/null || true
          docker rm frontend-container 2>/dev/null || true
          
          # Pull latest image
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          
          # Run new container
          docker run -d \
            --name frontend-container \
            --restart unless-stopped \
            -p 80:3000 \
            $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          
          # Cleanup old images
          docker image prune -f
          
          echo "Frontend deployed successfully!"
